[project]
name = "recipe-discovery-webapp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "tqdm>=4.66",
    "torch>=2.2",
    "torchvision>=0.17",
    "sentence-transformers>=3.0",
    "transformers>=4.38",
    "sentencepiece>=0.2",
    "Pillow>=10.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.5",
    "gdown>=5.2",
    "pytest>=8.2",
    "black>=24.4",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
